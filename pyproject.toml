[project]
name = "akrasia"
version = "0.1.0"
description = "A diagnostic instrument for the reasoning-to-execution gap in LLM sequential decision agents."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=2.44.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akrasia"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
